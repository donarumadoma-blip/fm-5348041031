<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff"><title>FollowMeter</title>
<style>
:root{--bg:#fff;--tx:#262626;--mut:#737373;--bd:#dbdbdb;--soft:#efefef;--blue:#0095f6;--red:#ff3040;--ok:#00a35a}
@media(prefers-color-scheme:dark){:root{--bg:#000;--tx:#f5f5f5;--mut:#a8a8a8;--bd:#262626;--soft:#262626;--ok:#3ddc84}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:470px;margin:0 auto;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:700;font-size:19px}
header small{font-weight:400;font-size:12px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav div{display:flex;width:100%;max-width:470px}
nav button{flex:1;background:none;border:0;padding:13px 0;color:var(--tx);cursor:pointer;position:relative}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on svg{stroke-width:2.8}
.dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:17px;padding:0 4px;text-align:center}
.av{border-radius:50%;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600;flex:none;overflow:hidden}
.ring{padding:3px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);flex:none;display:inline-block}
.ring>span{display:block;padding:2px;border-radius:50%;background:var(--bg)}.ring.off{background:var(--bd)}
.prof{display:flex;align-items:center;gap:22px;padding:16px 16px 8px}
.counts{display:flex;flex:1;justify-content:space-around;text-align:center}
.counts button{background:none;border:0;color:var(--tx);font:inherit;cursor:pointer;padding:2px 4px}
.counts b{display:block;font-size:17px}.counts span{font-size:13px}
.bio{padding:0 16px 4px}.bio b{display:block}.mut{color:var(--mut)}
.btn{border:0;font-family:inherit;text-align:center;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;background:var(--soft);color:var(--tx);cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.blue{background:var(--blue);color:#fff}.btn.red{background:#ed4956;color:#fff}.btn.sm{padding:6px 14px;flex:none}.btn:disabled{opacity:.6;cursor:default}
header .btn{font-size:13px}
.chips{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:16px;padding:6px 13px;background:var(--soft);color:var(--tx);font:600 13px -apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg)}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.stile{position:relative;text-align:left;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px 10px 8px;cursor:pointer;font:inherit}
.stile b{display:block;font-size:22px;line-height:1.25}.stile .sub{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.stile i{position:absolute;top:8px;right:10px;font-style:normal;color:var(--mut);font-size:16px}
.card{margin:12px 16px;border:1px solid var(--bd);border-radius:12px;padding:12px}
.card h3{margin:0 0 8px;font-size:14px}.card h3 small{font-weight:400;color:var(--mut)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv>div{background:var(--soft);border-radius:10px;padding:8px 10px;min-width:0}.kv b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kv span{font-size:12px;color:var(--mut)}
.tip{font-size:12px;color:var(--mut);min-height:18px;margin-bottom:4px}
svg.c{width:100%;height:auto;display:block;touch-action:pan-y}.bar{cursor:pointer}
table.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{color:var(--mut);font-weight:600;text-align:right;padding:6px 4px}
.tb th:first-child,.tb td:first-child{text-align:left}.tb td{padding:10px 4px;border-top:1px solid var(--bd);text-align:right}.tb tr[data-range-nav]{cursor:pointer}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0}.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.note{margin:2px 16px 6px;font-size:12px;color:var(--mut)}
.back{background:none;border:0;color:var(--tx);font-size:30px;line-height:1;padding:0 10px 0 0;cursor:pointer;font-weight:300}
.up{color:var(--ok)}.down{color:var(--red)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;width:72px;font-size:12px;text-decoration:none;color:var(--tx)}
.st i{font-style:normal;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.sec{padding:10px 16px 6px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.sec a,.sec button{font-size:13px;font-weight:600;color:var(--blue);background:none;border:0;cursor:pointer;text-decoration:none;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px;color:var(--tx)}
.row a.rl{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:inherit}
.row .t{flex:1;min-width:0}.row .t b,.row .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t span{color:var(--mut);font-size:13px}.row .t b{font-weight:600}
.row.new{background:color-mix(in srgb,var(--blue) 8%,transparent)}
.day{padding:14px 16px 4px;color:var(--mut);font-weight:600;font-size:13px}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;background:none;border:0;border-bottom:1px solid transparent;padding:11px 2px;color:var(--mut);font-weight:600;font-size:13px;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-color:var(--tx)}
.search{margin:10px 16px 6px;display:block;width:calc(100% - 32px);padding:9px 12px;border:0;border-radius:10px;background:var(--soft);color:var(--tx);font-size:15px;outline:none}
.tools{display:flex;gap:8px;padding:0 16px 6px}.tools select{flex:1;background:var(--soft);color:var(--tx);border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.v{width:14px;height:14px;vertical-align:-2px;margin-left:3px}
.more{display:block;margin:12px 16px;width:calc(100% - 32px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#262626;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90%;font-size:14px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30}
.modal>div{background:var(--bg);border-radius:14px;padding:20px;width:min(320px,90%)}
</style></head><body>

function bindCharts(){

    const c=CH[box.dataset.ch];if(!c)return;const svg=box.querySelector('svg'),tip=box.querySelector('.tip');

        let bi=0,bd=Infinity;s0.forEach((p,i)=>{const d=Math.abs(p[0]-t);if(d<bd){bd=d;bi=i}});

  ${newNo.length?`<div class="sec">New followers you don't follow</div>${mini(newNo,'Follow back')}`:''}`});
}
function people(){
  if(ROUTE.arg)SUB=ROUTE.arg;
  const names={not_following_back:["Not following back",D.not_following_back],fans:["You don't follow",D.fans],mutuals:["Mutual",D.mutuals]};
  if(!names[SUB])SUB='not_following_back';
  shell({tab:'people',body:`<div class="tabs">${Object.entries(names).map(([k,[n,a]])=>`<button class="${k===SUB?'on':''}" data-nav="people/${k}">${n} · ${num(a.length)}</button>`).join('')}</div>
  <input class="search" id="q" placeholder="Search" value="${esc(Q)}">
  <div class="tools"><select id="sort"><option value="az">Sort: A–Z</option><option value="recent">Sort: recently followed you</option><option value="verified">Sort: verified first</option></select>
  <select id="filt"><option value="all">All accounts</option><option value="verified">Verified</option><option value="private">Private</option><option value="public">Public</option></select></div>
  <div id="rows"></div>`});
  $('#sort').value=SORT;$('#filt').value=FILT;
  const refresh=()=>{$('#rows').innerHTML=peopleRows(names[SUB][1])};
  $('#q').oninput=e=>{Q=e.target.value;refresh()};$('#sort').onchange=e=>{SORT=e.target.value;refresh()};$('#filt').onchange=e=>{FILT=e.target.value;refresh()};refresh();
}
function peopleRows(all){
  const q=Q.trim().toLowerCase(),fol=new Set(D.following),fl=u=>(D.users[u]||['',0])[1];
  let list=all.filter(u=>!q||u.toLowerCase().includes(q)||((D.users[u]||[''])[0]||'').toLowerCase().includes(q));
  if(FILT==='verified')list=list.filter(u=>fl(u)&1);else if(FILT==='private')list=list.filter(u=>fl(u)&2);else if(FILT==='public')list=list.filter(u=>!(fl(u)&2));
  if(SORT==='recent')list=[...list].sort((a,b)=>(followedAt(b,Infinity)||0)-(followedAt(a,Infinity)||0));
  else if(SORT==='verified')list=[...list].sort((a,b)=>(fl(b)&1)-(fl(a)&1)||a.localeCompare(b));
  if(!list.length)return '<div class="empty">Nobody here.</div>';
  return list.slice(0,300).map(u=>{const t=followedAt(u,Infinity),m=D.users[u]||[''];
    return urow(u,esc(m[0])+(t?((m[0]?' · ':'')+'followed you '+ago(t)+' ago'):''),pill(u,fol,fol.has(u)?'Following':'View'))}).join('')
    +(list.length>300?`<div class="empty">Showing 300 of ${num(list.length)} — use search</div>`:'')}
function activity(){
  if(PREV!=='activity')SEEN0=+(store.get('fm_seen')||0);
  const b=bounds(RANGE);let evs=D.events.filter(e=>!RANGE||e.ts>D.ts-RANGE*DAY);
  if(AF!=='all')evs=evs.filter(e=>e.kind===AF);
  shell({tab:'activity',body:`<div class="sec">Activity</div>${chips()}
   <div class="chips" style="padding-top:0"><button class="chip ${AF==='all'?'on':''}" data-af="all">All</button><button class="chip ${AF==='follow'?'on':''}" data-af="follow">Follows</button><button class="chip ${AF==='unfollow'?'on':''}" data-af="unfollow">Unfollows</button></div>
   ${evs.length?'':'<div class="empty"><b>No activity in this period</b><br>Follows and unfollows show up here after each daily check.</div>'}${evs.length?evRows(evs,Math.max(LIMIT,100)):''}`});
  store.set('fm_seen',String(Math.floor(Date.now()/1000)));
}
/* ---------- router ---------- */
function parse(){const h=location.hash.replace(/^#\/?/,'').split('?')[0].split('/');return{name:h[0]||'home',arg:h[1]||''}}
function draw(){
  ROUTE=parse();CH={};
  ({home,people,stats:statsPage,activity,gained:()=>pageEvents('follow'),lost:()=>pageEvents('unfollow'),net:netPage}[ROUTE.name]||home)();
  PREV=ROUTE.name;bindCharts();
}
function redraw(){const y=scrollY;draw();scrollTo(0,y)}
window.addEventListener('hashchange',()=>{LIMIT=60;draw();scrollTo(0,0)});
/* ---------- admin ---------- */
function admModal(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div><b style="font-size:16px">Admin</b><p style="color:var(--mut);margin:6px 0 0">Unlock to follow / unfollow from here.</p><input class="search" id="ap" type="password" placeholder="Admin password" autocomplete="off" style="margin:12px 0;width:100%"><button class="btn blue" id="ago" style="width:100%">Unlock</button><p id="aerr" style="color:var(--red);margin:8px 0 0"></p></div>';
  m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);
  const go=async()=>{const err=$('#aerr');err.textContent='';$('#ago').disabled=true;
    try{const r=await fetch(ADMIN_URL+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#ap').value})});
      const j=await r.json();if(r.ok&&j.token){admSet(j.token);m.remove();toast('Admin unlocked');redraw()}else{err.textContent=j.error||'Failed';$('#ago').disabled=false}}
    catch(e){err.textContent="Can't reach the Pi right now";$('#ago').disabled=false}};
  $('#ago').onclick=go;$('#ap').onkeydown=e=>{if(e.key==='Enter')go()};$('#ap').focus();
}
document.addEventListener('click',async e=>{
  const act=e.target.closest('.act');
  if(act){e.preventDefault();
    if(act.dataset.c!=='1'){const t=act.textContent;act.dataset.c='1';act.textContent='Confirm?';act.classList.add('red');
      setTimeout(()=>{if(act.isConnected&&act.dataset.c==='1'){act.dataset.c='';act.textContent=t;act.classList.remove('red')}},3000);return}
    const u=act.dataset.u,a=act.dataset.a;act.disabled=true;act.textContent='…';
    try{
      const r=await fetch(ADMIN_URL+'/action',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+admTok()},body:JSON.stringify({action:a,username:u})});
      const j=await r.json().catch(()=>({}));
      if(r.status===401&&j.error==='locked'){admSet('');toast('Admin session expired — unlock again');redraw();return}
      if(!r.ok){toast(j.error||'Action failed');redraw();return}
      const fg=new Set(D.following);j.following?fg.add(u):fg.delete(u);D.following=[...fg];
      if(j.requested)PEND.add(u);recompute();redraw();
      toast(j.requested?`Follow request sent to ${u}`:(j.following?`Now following ${u}`:`Unfollowed ${u}`));
    }catch(err){toast("Can't reach the Pi right now");redraw()}
    return}
  const n=e.target.closest('[data-nav]');if(n){const h='#/'+n.dataset.nav;if(location.hash===h)scrollTo(0,0);else location.hash=h;return}
  const r=e.target.closest('[data-range]');if(r){RANGE=+r.dataset.range;store.set('fm_range',String(RANGE));LIMIT=60;redraw();return}
  const rn=e.target.closest('[data-range-nav]');if(rn){RANGE=+rn.dataset.rangeNav;store.set('fm_range',String(RANGE));location.hash='#/net';return}
  const g=e.target.closest('[data-grow]');if(g){GROW=g.dataset.grow;redraw();return}
  const af=e.target.closest('[data-af]');if(af){AF=af.dataset.af;LIMIT=60;redraw();return}
  const mo=e.target.closest('[data-more]');if(mo){LIMIT+=60;redraw();return}
});
/* ---------- start ---------- */
function start(p){D=p;D.events=D.events||[];index();$('#lock').hidden=true;$('#app').hidden=false;
  if(!store.get('fm_seen'))store.set('fm_seen',String(Math.floor(D.ts-2*DAY)));
  SEEN0=+(store.get('fm_seen')||0);draw()}
async function go(){try{const p=await unlock($('#pw').value);try{sessionStorage.setItem('fm',$('#pw').value)}catch(e){}start(p)}catch(e){$('#err').textContent='Wrong password'}}
if(BLOB.plain)start(BLOB.plain);
else{$('#lock').hidden=false;$('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
  try{const s=sessionStorage.getItem('fm');if(s){$('#pw').value=s;go()}}catch(e){}}
</script></body></html>
